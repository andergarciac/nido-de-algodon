<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nido de Algodón</title>
<meta name="description" content="Sábanas y línea infantil de muy buena calidad, hechas con cariño en Medellín. Domicilio gratis en el Valle de Aburrá.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDE7DA; --paper-2:#E2D9C6; --surface:#FFFFFF;
  --ink:#20262F; --muted:#6B6558;
  --line:#D7CCB3;
  --accent:#C8324A; --accent-dark:#9D2439;
  --gold:#BD8A2C;
  --shadow:0 18px 44px -20px rgba(32,38,47,.28);
  --shadow-sm:0 6px 18px -10px rgba(32,38,47,.2);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1915; --paper-2:#242019; --surface:#262220;
    --ink:#EDE6DA; --muted:#AA9F8C;
    --line:#3B342A;
    --accent:#E8647A; --accent-dark:#C84A62;
    --gold:#D6A94A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1915; --paper-2:#242019; --surface:#262220;
  --ink:#EDE6DA; --muted:#AA9F8C;
  --line:#3B342A;
  --accent:#E8647A; --accent-dark:#C84A62;
  --gold:#D6A94A;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font-family:'Figtree',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
h1,h2,h3,.serif{font-family:'Instrument Serif',serif;font-weight:400;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));}

/* ---------- motivo "puntada" (usado como divisor en vez de una línea genérica) ---------- */
.stitch{height:2px;border:none;margin:0;background-image:repeating-linear-gradient(to right, var(--line) 0 9px, transparent 9px 16px);}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 24px;border-radius:999px;font-weight:600;font-size:15px;border:none;cursor:pointer;transition:transform .15s ease,background .15s ease;white-space:nowrap;}
.btn-wa{background:#25D366;color:#fff;}
.btn-wa:hover{transform:translateY(-2px);}
.btn-line{background:transparent;border:1.5px solid var(--ink);color:var(--ink);}
.btn-line:hover{background:var(--ink);color:var(--paper);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:var(--accent-dark);transform:translateY(-2px);}

/* ---------- encabezado ---------- */
.topnote{background:var(--ink);color:var(--paper);text-align:center;font-size:13px;font-weight:500;padding:8px max(20px,env(safe-area-inset-left,0px));letter-spacing:.01em;}
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--paper) 90%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;max-width:1180px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:11px;min-width:0;}
.logo-mark{width:38px;height:38px;flex-shrink:0;}
.logo-text{line-height:1.15;min-width:0;}
.logo-text b{font-family:'Instrument Serif',serif;font-size:21px;font-weight:400;display:block;}
.logo-text span{font-size:12px;color:var(--muted);}
nav.catnav{display:none;gap:22px;}
@media(min-width:860px){nav.catnav{display:flex;}}
nav.catnav a{font-size:14.5px;color:var(--muted);padding-bottom:3px;border-bottom:2px solid transparent;transition:color .15s ease,border-color .15s ease;}
nav.catnav a:hover{color:var(--ink);}
.header-actions{display:flex;align-items:center;gap:10px;}
.header-wa{display:none;}
@media(min-width:620px){.header-wa{display:inline-flex;}}
.admin-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);color:var(--muted);flex-shrink:0;transition:background .2s ease,color .2s ease;}
.admin-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.admin-btn svg{width:16px;height:16px;}

/* ---------- hero ---------- */
.hero{padding:56px 0 52px;}
.hero-grid{display:grid;grid-template-columns:1fr;gap:46px;align-items:center;}
@media(min-width:900px){.hero-grid{grid-template-columns:1fr .95fr;gap:36px;}}
.hero-copy{max-width:52ch;}
h1.hero-title{font-size:clamp(34px,5.6vw,58px);line-height:1.04;letter-spacing:-.01em;margin:0 0 20px;text-wrap:balance;}
h1.hero-title em{font-style:italic;color:var(--accent);}
.hero-sub{font-size:17px;line-height:1.65;color:var(--muted);max-width:42ch;margin:0 0 30px;}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:28px;}
.hero-trust{display:flex;flex-wrap:wrap;column-gap:20px;row-gap:8px;font-size:13.5px;color:var(--muted);}
.hero-trust span{display:inline-flex;align-items:center;gap:7px;}
.hero-trust svg{width:14px;height:14px;color:var(--gold);flex-shrink:0;}

/* mosaico de telas: retrato literal del producto, no decoración genérica */
.mosaic{position:relative;height:380px;}
.mosaic .tile{position:absolute;overflow:hidden;border-radius:10px;border:5px solid var(--surface);box-shadow:var(--shadow);opacity:0;transform:scale(.8) rotate(0deg);animation:settle .6s cubic-bezier(.2,.8,.2,1) forwards;}
.mosaic .tile img{width:100%;height:100%;object-fit:cover;}
@keyframes settle{to{opacity:1;}}
@media(prefers-reduced-motion: reduce){.mosaic .tile{animation:none;opacity:1;}}
.t1{width:48%;top:0;left:2%;aspect-ratio:4/5;transform:rotate(-5deg) scale(.8);animation-delay:.05s;z-index:3;}
.t1.settled{transform:rotate(-5deg);}
.t2{width:42%;top:6%;right:0;aspect-ratio:1/1;transform:rotate(4deg) scale(.8);animation-delay:.18s;z-index:2;}
.t2.settled{transform:rotate(4deg);}
.t3{width:36%;bottom:0;left:10%;aspect-ratio:1/1;transform:rotate(3deg) scale(.8);animation-delay:.3s;z-index:4;}
.t3.settled{transform:rotate(3deg);}
.t4{width:34%;bottom:2%;right:6%;aspect-ratio:4/5;transform:rotate(-4deg) scale(.8);animation-delay:.42s;z-index:1;}
.t4.settled{transform:rotate(-4deg);}
@media(max-width:899px){
  .mosaic{height:auto;display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;-webkit-overflow-scrolling:touch;}
  .mosaic .tile{position:static;flex:0 0 auto;width:148px;aspect-ratio:4/5 !important;transform:none !important;}
}

/* ---------- historia ---------- */
.story{padding:18px 0 58px;border-top:2px solid transparent;}
.story-grid{display:grid;grid-template-columns:1fr;gap:38px;}
@media(min-width:880px){.story-grid{grid-template-columns:1.1fr .9fr;gap:70px;}}
.story h2{font-size:clamp(26px,3.4vw,36px);font-weight:400;margin:0 0 16px;line-height:1.15;max-width:16ch;}
.story p{font-size:15.5px;line-height:1.75;color:var(--muted);max-width:56ch;margin:0 0 14px;}
.story-sign{font-family:'Instrument Serif',serif;font-style:italic;font-size:19px;color:var(--accent);margin-top:10px;}
.feature-list{display:flex;flex-direction:column;}
.feature-row{padding:16px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:baseline;}
.feature-row:last-child{border-bottom:1px solid var(--line);}
.feature-row b{font-family:'Instrument Serif',serif;font-weight:400;font-size:19px;white-space:nowrap;}
.feature-row span{font-size:13.5px;color:var(--muted);line-height:1.5;}

/* ---------- productos ---------- */
.products{padding:10px 0 60px;}
.section-head{max-width:640px;margin:0 0 30px;}
.section-head h2{font-size:clamp(28px,3.8vw,38px);font-weight:400;margin:0 0 8px;}
.section-head p{font-size:15px;color:var(--muted);margin:0;max-width:52ch;}

.cat-tabs{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:30px;}
.cat-tab{background:none;border:none;cursor:pointer;padding:6px 0 10px;font-size:16px;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:baseline;gap:7px;transition:color .15s ease,border-color .15s ease;}
.cat-tab:hover{color:var(--ink);}
.cat-tab.active{color:var(--ink);border-color:var(--accent);}
.cat-tab sup{font-size:11px;color:var(--muted);font-weight:600;}

#catEmpty{padding:50px 20px;color:var(--muted);border-top:1px solid var(--line);font-size:14.5px;}
#catEmpty b{display:block;font-family:'Instrument Serif',serif;font-size:21px;color:var(--ink);font-weight:400;margin-bottom:6px;}

.panel-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;}
.panel-head h3{font-size:24px;font-weight:400;margin:0;}
.spec-line{font-size:13px;color:var(--muted);}
.spec-line span:not(:last-child)::after{content:" · ";color:var(--line);}

.price-row{display:flex;flex-wrap:wrap;gap:4px 26px;padding:14px 0;margin-bottom:22px;}
.price-item{display:flex;align-items:baseline;gap:8px;font-size:14px;}
.price-item .pg-size{color:var(--muted);}
.price-item .pg-price{font-family:'Instrument Serif',serif;font-size:19px;color:var(--accent);}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr);}}
.card{margin:0;background:var(--surface);overflow:hidden;}
.card-img{aspect-ratio:1/1;overflow:hidden;background:var(--paper-2);}
.card-img img{width:100%;height:100%;object-fit:cover;}
.card-cap{padding:9px 2px 2px;}
.card-label{font-size:12.5px;color:var(--muted);line-height:1.3;}

/* ---------- cta final ---------- */
.final-cta{background:var(--accent);color:#fff;padding:58px 0;margin:10px 0 0;border-top:2px solid var(--accent-dark);border-bottom:2px solid var(--accent-dark);}
.final-cta-inner{text-align:center;max-width:560px;margin:0 auto;}
.final-cta h2{font-size:clamp(26px,3.6vw,36px);font-weight:400;margin:0 0 14px;}
.final-cta p{font-size:15.5px;opacity:.92;margin:0 auto 26px;line-height:1.6;}

footer{background:var(--ink);color:color-mix(in srgb, var(--paper) 82%, var(--ink) 18%);padding:48px 0 26px;}
.footer-grid{display:grid;grid-template-columns:1fr;gap:30px;margin-bottom:30px;}
@media(min-width:720px){.footer-grid{grid-template-columns:1.3fr 1fr 1fr;}}
.footer-logo{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.footer-logo svg{width:32px;height:32px;}
.footer-logo b{font-family:'Instrument Serif',serif;font-size:20px;color:var(--paper);font-weight:400;}
footer p{font-size:13.5px;line-height:1.65;max-width:34ch;opacity:.7;}
footer h4{font-size:13px;color:var(--paper);margin:0 0 13px;font-weight:600;}
footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
footer a{font-size:13.5px;opacity:.78;}
footer a:hover{opacity:1;}
.footer-bottom{border-top:1px solid rgba(255,255,255,.14);padding-top:18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;font-size:12px;opacity:.6;}
.admin-link{color:inherit;opacity:.55;}
.admin-link:hover{opacity:1;}
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
"use strict";

/* Los enlaces de invitación/recuperación de contraseña de Netlify Identity
   llegan a la raíz del sitio (aquí) con un token en el hash. El widget que
   sabe procesarlos vive en /admin, así que lo redirigimos preservando el hash. */
if(/^#(confirmation_token|invite_token|recovery_token|email_change_token)=/.test(location.hash)){
  location.replace("/admin/" + location.hash);
  return;
}

var NEST_MARK = '<svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="23" fill="var(--accent)"/><circle cx="18" cy="21" r="8.5" fill="#fff"/><circle cx="29.5" cy="19.5" r="9.5" fill="#fff"/><circle cx="23.5" cy="30" r="8" fill="#fff"/></svg>';
var WA_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.1.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.2-.5.1-.2 0-.4 0-.5-.1-.1-.6-1.5-.8-2-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.7c.1.2 2 3 4.7 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.2-.3-.2-.6-.4z"/><path d="M12 2a10 10 0 00-8.5 15.3L2 22l4.8-1.5A10 10 0 1012 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.3 1 1-3.2-.2-.3A8.2 8.2 0 1112 20.2z"/></svg>';
var CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
var ADMIN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>';

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function waLink(num, msg){ return "https://wa.me/" + num + "?text=" + encodeURIComponent(msg); }

var state = null;
var activeCat = null;

function buildMosaic(visibleCats){
  var pics = [];
  visibleCats.forEach(function(c){
    (c.items||[]).slice(0,3).forEach(function(it){ pics.push({url:it.url, alt: it.label || c.name}); });
  });
  // intercala para variar categorías si hay más de una
  pics.sort(function(a,b){ return (a.url.length*7 + a.url.charCodeAt(2)) % 5 - (b.url.length*7 + b.url.charCodeAt(2)) % 5; });
  var slots = ['t1','t2','t3','t4'];
  return slots.map(function(cls,i){
    var p = pics[i % Math.max(pics.length,1)];
    if(!p) return '';
    return '<div class="tile '+cls+'"><img src="'+esc(p.url)+'" alt="'+esc(p.alt)+'" loading="eager"></div>';
  }).join('');
}

function render(){
  if(!state) return;
  var root = document.getElementById("root");
  var wa = waLink(state.brand.waNumber, state.brand.waMessage);
  var visibleCats = state.categories.filter(function(c){ return c.active !== false; });
  var html = "";

  html += '<div class="topnote">'+esc(state.banner)+'</div>';

  html += '<header><div class="header-inner wrap">'+
    '<a class="logo" href="#"><span class="logo-mark">'+NEST_MARK+'</span>'+
    '<span class="logo-text"><b>'+esc(state.brand.name)+'</b><span>'+esc(state.brand.tagline)+'</span></span></a>'+
    '<nav class="catnav">'+visibleCats.map(function(c){ return '<a href="#productos" data-cat="'+esc(c.id)+'">'+esc(c.name)+'</a>'; }).join('')+'</nav>'+
    '<div class="header-actions">'+
      '<a class="btn btn-wa header-wa" href="'+wa+'" target="_blank" rel="noopener">'+WA_ICON+' Escríbenos</a>'+
      '<a class="admin-btn" href="/admin/" title="Administrador">'+ADMIN_ICON+'</a>'+
    '</div>'+
    '</div></header>';

  html += '<section class="hero"><div class="wrap hero-grid">'+
    '<div class="hero-copy">'+
      '<h1 class="hero-title">'+esc(state.hero.title)+'</h1>'+
      '<p class="hero-sub">'+esc(state.hero.sub)+'</p>'+
      '<div class="hero-actions">'+
        '<a href="'+wa+'" target="_blank" rel="noopener" class="btn btn-accent">'+WA_ICON+' Escribir por WhatsApp</a>'+
        '<a href="#productos" class="btn btn-line" data-scroll>Ver diseños</a>'+
      '</div>'+
      '<div class="hero-trust">'+
        '<span>'+CHECK_ICON+' Domicilio gratis</span>'+
        '<span>'+CHECK_ICON+' Calidad garantizada</span>'+
        '<span>'+CHECK_ICON+' Atención personalizada</span>'+
      '</div>'+
    '</div>'+
    '<div class="mosaic">'+buildMosaic(visibleCats)+'</div>'+
    '</div></section>';

  html += '<hr class="stitch wrap" style="max-width:1180px;margin:0 auto;">';

  html += '<section class="story"><div class="wrap story-grid"><div>'+
    '<h2>'+esc(state.story.title)+'</h2>'+
    state.story.paragraphs.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('')+
    '<p class="story-sign">'+esc(state.story.sign)+'</p>'+
    '</div><div class="feature-list">'+
    (state.story.features||[]).map(function(f){
      return '<div class="feature-row"><b>'+esc(f.title)+'</b><span>'+esc(f.text)+'</span></div>';
    }).join('')+
    '</div></div></section>';

  html += '<section class="products" id="productos"><div class="wrap">'+
    '<div class="section-head"><h2>Nuestros productos</h2><p>Elige una línea para ver los estampados, medidas y precios disponibles.</p></div>'+
    '<div class="cat-tabs">'+
    visibleCats.map(function(c){
      var active = activeCat===c.id || (!activeCat && c===visibleCats[0]);
      return '<button class="cat-tab'+(active?' active':'')+'" data-cat="'+esc(c.id)+'">'+esc(c.name)+' <sup>'+c.items.length+'</sup></button>';
    }).join('')+
    '</div>';

  var currentId = activeCat || (visibleCats[0] && visibleCats[0].id);
  var cat = visibleCats.filter(function(c){return c.id===currentId;})[0];

  if(!cat){
    html += '<div id="catEmpty"><b>Aún no hay productos para mostrar</b>Vuelve pronto.</div>';
  } else {
      html += '<div class="panel-head"><h3>'+esc(cat.name)+'</h3><div class="spec-line">'+
        cat.specs.map(function(s){return '<span>'+esc(s)+'</span>';}).join('')+
        '</div></div>';
      html += '<div class="price-row">'+cat.priceGroups.map(function(pg){
        return '<div class="price-item"><span class="pg-size">'+esc(pg.label)+'</span><span class="pg-price">'+esc(pg.price)+'</span></div>';
      }).join('')+'</div>';
      html += '<div class="grid">'+cat.items.map(function(it){
        return '<figure class="card"><div class="card-img"><img src="'+esc(it.url)+'" loading="lazy" alt="'+esc(it.label||cat.name)+'"></div>'+
          (it.label?('<div class="card-cap"><span class="card-label">'+esc(it.label)+'</span></div>'):'')+
          '</figure>';
      }).join('')+'</div>';
  }
  html += '</div></section>';

  html += '<div class="final-cta"><div class="wrap final-cta-inner">'+
    '<h2>'+esc(state.finalCta.title)+'</h2><p>'+esc(state.finalCta.text)+'</p>'+
    '<a href="'+wa+'" target="_blank" rel="noopener" class="btn" style="background:#fff;color:var(--accent-dark)">'+WA_ICON+' Escribir por WhatsApp</a>'+
    '</div></div>';

  html += '<footer><div class="wrap"><div class="footer-grid"><div><div class="footer-logo">'+NEST_MARK+'<b>'+esc(state.brand.name)+'</b></div><p>'+esc(state.footer.note)+'</p></div>'+
    '<div><h4>Productos</h4><ul>'+visibleCats.map(function(c){return '<li><a href="#productos" data-cat="'+esc(c.id)+'">'+esc(c.name)+'</a></li>';}).join('')+'</ul></div>'+
    '<div><h4>Contacto</h4><ul><li><a href="'+wa+'" target="_blank" rel="noopener">WhatsApp: '+esc(state.brand.waDisplay||state.brand.waNumber)+'</a></li><li>'+esc(state.footer.location)+'</li></ul></div>'+
    '</div><div class="footer-bottom"><span>'+esc(state.footer.copyright)+'</span>'+
    '<a class="admin-link" href="/admin/">Administrador</a></div></div></footer>';

  root.innerHTML = html;
}

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-cat]");
  if(el){
    e.preventDefault();
    activeCat = el.getAttribute("data-cat");
    render();
    document.getElementById("productos").scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  var sc = e.target.closest("[data-scroll]");
  if(sc){
    e.preventDefault();
    document.getElementById("productos").scrollIntoView({behavior:"smooth", block:"start"});
  }
});

fetch("/content/site.json", {cache:"no-store"})
  .then(function(r){ return r.json(); })
  .then(function(data){ state = data; render(); })
  .catch(function(err){
    document.getElementById("root").innerHTML = '<p style="padding:40px;text-align:center;color:#6B6558;">No se pudo cargar el contenido. Intenta recargar la página.</p>';
    console.error(err);
  });

})();
</script>
</body>
</html>
